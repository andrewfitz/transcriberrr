[package]
name = "transcriberrr"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Offline Qwen3-ASR transcription for Apple Silicon"
license = "MIT"

[features]
default = []
## Enable the Parakeet Unified Burn/Metal backend. Diarization reuses the same crate but remains
## independently optional for users who only need the ASR engine.
parakeet = ["dep:parakeet-rs"]
diarization = ["parakeet"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hf-hub = "0.4"
## SIGTERM handling for graceful cancellation (already in the dependency tree).
libc = "0.2"
## Same letter/number test as the Qwen aligner (already in the dependency tree).
unicode-general-category = "1.1"
clap = { version = "4.5", features = ["derive"] }
qwen3_asr = { git = "https://github.com/lumosimmo/qwen3-asr-rs.git", package = "qwen3_asr", features = ["metal", "forced-aligner", "audio-loading"] }
candle-core = { version = "0.9", features = ["metal"] }
## Silero VAD in pure Rust with its weights compiled in, used to skip Qwen3 chunks without
## speech. Pinned: 0.1.0 matched the official snakers4 Silero ONNX model to within 1e-4 on
## every frame of a 40-run speech/noise battery; a new release could swap the weights.
rustvani-vad = "=0.1.0"
parakeet-rs ={ version = "0.4.1", optional = true, default-features = false, features = ["burn", "metal", "sortformer"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", features = ["aac", "aiff", "caf", "flac", "isomp4", "mkv", "mp3", "ogg", "vorbis", "wav"] }
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"

## Unoptimized Silero runs ~12x slower, which made the VAD tests take 30 s instead of 2 s.
[profile.dev.package.rustvani-vad]
opt-level = 3
