[package]
name = "transcriberrr"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "Local transcription and speaker-track merging for Apple Silicon"
license = "MIT"

[features]
default = []
## Enable the Parakeet Unified Burn/Metal backend. Diarization reuses the same crate but remains
## independently optional for users who only need the ASR engine.
parakeet = ["dep:parakeet-rs", "dep:ndarray", "dep:realfft"]
diarization = ["parakeet", "parakeet-rs/sortformer"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
## The realtime listener's header-read timeout (already in the dependency tree through axum).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
rubato = "0.16.2"
subtle = "2.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hf-hub = "0.4"
## SIGTERM handling for graceful cancellation (already in the dependency tree).
libc = "0.2"
## Same letter/number test as the Qwen aligner (already in the dependency tree).
unicode-general-category = "1.1"
unicode-normalization = "0.1"
clap = { version = "4.5", features = ["derive"] }
qwen3_asr = { git = "https://github.com/lumosimmo/qwen3-asr-rs.git", rev = "7984967e8701cc90bb17d06453901036e36ca578", package = "qwen3_asr", features = ["metal", "forced-aligner", "audio-loading"] }
candle-core = { version = "0.9", features = ["metal"] }
## Silero VAD in pure Rust with its weights compiled in, used to skip Qwen3 chunks without
## speech. Pinned: 0.1.0 matched the official snakers4 Silero ONNX model to within 1e-4 on
## every frame of a 40-run speech/noise battery; a new release could swap the weights.
rustvani-vad = "=0.1.0"
ring = "0.17"
## Raw DEFLATE for the recognition exchange shared with MPCut, whose Compression framework
## reads and writes the same streams (already in the dependency tree).
miniz_oxide = "0.9"
## Pinned: each release generates its Burn graphs from specific ONNX exports. Bump it together
## with PARAKEET_RS_REVISION in src/model_cache.rs, then run examples/parakeet_parity.rs.
parakeet-rs = { version = "=0.4.4", optional = true, default-features = false, features = ["burn", "metal"] }
## The live Parakeet stream (src/serve/parakeet_stream.rs) builds feature and encoder tensors for
## parakeet-rs's public model API. Keep both at the versions parakeet-rs itself uses.
ndarray = { version = "0.17", optional = true }
realfft = { version = "3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
## Inspect MP4 presentation edits when matching a renamed Zoom video to its mixed AAC track.
mp4-atom = "0.17.1"
symphonia = { version = "0.5", features = ["aac", "aiff", "caf", "flac", "isomp4", "mkv", "mp3", "ogg", "vorbis", "wav"] }
walkdir = "2.5"

[dev-dependencies]
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"

## Unoptimized Silero runs ~12x slower, which made the VAD tests take 30 s instead of 2 s.
[profile.dev.package.rustvani-vad]
opt-level = 3
